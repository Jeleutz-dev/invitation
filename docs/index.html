<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Date RSVP</title>
    <!-- Dynamic Favicon (Defaults to Spiderman) -->
    <link rel="icon" id="pageIcon" type="image/png" href="./assets/spideyyy.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Default Spiderman Background */
            background-image: url('./assets/wallpaper/spiderman_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Poppins', sans-serif;
            color: #e0e0e0; 
            overflow: hidden;
        }

        .card {
            background: rgba(255,255,255,.08);
            padding: 3rem 4rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.15);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 2rem;
            line-height: 1.3;
            text-shadow: 0 2px 15px rgba(255, 255, 255, 0.15);
        }

        .details {
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #f5f5f5;
        }

        .highlight {
            font-weight: 500;
            color: #ff4d4d; /* Spiderman Red */
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        button {
            padding: 12px 36px;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-yes {
            background-color: #E23636; /* Spidey Red */
            color: white;
            box-shadow: 0 4px 15px rgba(226, 54, 54, 0.3);
        }

        .btn-yes:hover {
            background-color: #C62828;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #2B5292; /* Muted Web-Slinger Blue */
            color: white;
            transition: left 0.4s ease-out, top 0.4s ease-out, transform 0.2s, background-color 0.2s;
            z-index: 50;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Web 1: The Shooting String */
        .web-shoot {
            position: fixed;
            top: 58%;
            left: 48%;
            width: 100vw; 
            height: 100vh;
            object-fit: cover;
            z-index: 2000; 
            pointer-events: none;
            opacity: 0;
        }

        /* Web 2: The Splat */
        .web-splat {
            position: absolute;
            top: 58%;
            left: 48%;
            width: 100vw; 
            height: 100vh;
            object-fit: cover;
            z-index: 3; 
            pointer-events: none;
            opacity: 0;
        }

        /* The Modal Card */
        .modal-content {
            position: relative;
            z-index: 2; 
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3rem;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5); 
            color: #f5f5f5; 
            opacity: 0; 
        }

        /* --- THE ANIMATION TIMELINE --- */
        @keyframes shootWeb {
            0% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        @keyframes splatIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        @keyframes pullOutWeb {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-70%, 60%) scale(5); opacity: 0; }
        }
        @keyframes pullModal {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #ff4d4d; 
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
        }

        /* --- DOOMSDAY THEME OVERRIDES --- */
       body.doomsday-theme {
            background-image: url('./assets/wallpaper/doomsday_bg.png') !important;
        }
        .doomsday-theme .highlight {
            color: #2ecc71; /* Doom Green */
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }
        .doomsday-theme .btn-yes {
            background-color: #1e5631; 
            box-shadow: 0 4px 15px rgba(30, 86, 49, 0.3);
        }
        .doomsday-theme .btn-yes:hover {
            background-color: #143d22;
        }
        .doomsday-theme .modal-title {
            color: #2ecc71;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="inviteTitle">Will you go on a movie date with me? <br><em>I bought tickets!</em></h1>
        
        <div class="details">
            <p><strong>Movie:</strong> <span class="highlight" id="movieName">Spiderman: Brand New Day</span></p>
            <p id="dateLine"><strong>Date & Time:</strong> <span id="dateTime">July 31, 2026 @ 9:15 PM</span></p>
            <p id="locLine"><strong>Location:</strong> <span id="locationPlace">SM MOA ScreenX</span></p>
        </div>

        <div class="buttons">
            <button class="btn-yes" id="yesBtn">Yes</button>
            <button class="btn-no" id="noBtn">No</button>
        </div>
    </div>

    <!-- Web String: Hidden by default, shoots from the camera -->
    <img src="./assets/wallpaper/web1.png" id="web1" class="web-shoot" alt="Web String">

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="successModal">
        <!-- Splat Image -->
        <img src="./assets/wallpaper/web2.png" id="web2" class="web-splat" alt="Web Splat">
        
        <div class="modal-content">
            <div class="modal-title">It's a Date!</div>
            <p id="modalMessage">Best decision you've made all day!<br>See you on the 1st of August!</p>
        </div>
    </div>
    
    <script>
        // --- URL PARAMETER LOGIC ---
        const params = new URLSearchParams(window.location.search);
        
        if (params.has('name')) {
            document.getElementById('inviteTitle').innerHTML = params.get('name') + ", will you go on a movie date with me? <br><em>I bought tickets!</em>";
        }

        // --- THEME SWAP LOGIC ---
        const movieChoice = params.get('movie');
        if (movieChoice) {
            document.getElementById('movieName').textContent = movieChoice;
            
            // If they picked Doomsday, swap the background, icon, and colors
            if (movieChoice === 'Avengers: Doomsday') {
                document.body.classList.add('doomsday-theme');
                document.getElementById('pageIcon').href = "./assets/dr-doom.png";
            }
        }

        // --- DATE & LOCATION VISIBILITY LOGIC ---
        if (window.location.search) {
            const dateVal = params.get('date');
            if (!dateVal || dateVal.trim() === "") {
                document.getElementById('dateLine').style.display = 'none';
            } else {
                document.getElementById('dateTime').textContent = dateVal;
            }

            const locVal = params.get('loc');
            if (!locVal || locVal.trim() === "") {
                document.getElementById('locLine').style.display = 'none';
            } else {
                document.getElementById('locationPlace').textContent = locVal;
            }
        }
        
        if (params.has('msg')) {
            document.getElementById('modalMessage').innerHTML = params.get('msg');
        }

        // --- CHECK ANIMATION PREFERENCE ---
        let enableSpidey = true;
        // Turn off webs automatically if the movie is Doomsday
        if (movieChoice === 'Avengers: Doomsday') {
            enableSpidey = false;
        }
        // ---------------------------
        
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const modal = document.getElementById('successModal');
        const web1 = document.getElementById('web1');
        const web2 = document.getElementById('web2');
        const modalContent = document.querySelector('.modal-content');

        let splatTimer, pullTimer;

        // --- MOBILE-FRIENDLY RUNAWAY LOGIC ---
        function runaway(e) {
            // Prevent the default action so a tap doesn't register as a click
            if (e) e.preventDefault();

            if (noBtn.style.position !== 'fixed') {
                const rect = noBtn.getBoundingClientRect();
                document.body.appendChild(noBtn);
                noBtn.style.position = 'fixed';
                noBtn.style.left = rect.left + 'px';
                noBtn.style.top = rect.top + 'px';
                noBtn.getBoundingClientRect(); 
            }

            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            const randomX = Math.max(0, Math.floor(Math.random() * maxX));
            const randomY = Math.max(0, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Bind the runaway function to mouse hover AND mobile touch/clicks
        noBtn.addEventListener('mouseover', runaway);
        noBtn.addEventListener('touchstart', runaway);
        noBtn.addEventListener('click', runaway);

        // The "Yes" Button Action Sequence
        yesBtn.addEventListener('click', function() {
            web1.style.animation = 'none';
            web2.style.animation = 'none';
            modalContent.style.animation = 'none';
            void web1.offsetWidth; 

            modal.classList.add('active');
            
            if (enableSpidey) {
                // RUN FULL SPIDERMAN ANIMATION
                web1.style.animation = 'shootWeb 0.25s ease-out forwards';
                splatTimer = setTimeout(() => {
                    web2.style.animation = 'splatIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                    pullTimer = setTimeout(() => {
                        web1.style.animation = 'pullOutWeb 0.25s ease-in forwards';
                        web2.style.animation = 'pullOutWeb 0.25s ease-in forwards';
                        modalContent.style.animation = 'pullModal 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                    }, 250); 
                }, 250); 
            } else {
                // SKIP WEBS, JUST POP THE MODAL OPEN
                modalContent.style.animation = 'pullModal 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            }
        });

        // Close Modal on Outside Click
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.classList.remove('active');
                clearTimeout(splatTimer);
                clearTimeout(pullTimer);
                web1.style.animation = 'none';
                web2.style.animation = 'none';
                modalContent.style.animation = 'none';
            }
        });
    </script>
</body>
</html>
